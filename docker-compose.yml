services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kassa
      POSTGRES_USER: ${DB_USER:-data}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-data}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-data}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      TZ: Asia/Tashkent
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    volumes:
      - applogs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # TEST tunnel: Mini App uchun vaqtinchalik ommaviy HTTPS (trycloudflare.com, har startda yangi URL).
  # URL: `docker compose logs tunnel | grep trycloudflare` → .env WEBAPP_URL → `docker compose up -d app`.
  # Ishlab chiqarishda o'rniga server + buxgalteriya.nsb.uz (Caddy/nginx reverse proxy → app:8080).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  applogs:
