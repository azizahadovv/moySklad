services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kassa
      POSTGRES_USER: ${DB_USER:-data}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-data}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-data} -d kassa"]   # -d siz baza nomi = user nomi ("data") bo'lib, har 5 s FATAL yozardi
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      TZ: Asia/Tashkent
      WEBAPP_PORT: 8080          # контейнер ичида ДОИМ 8080 (ташқари порт — HOST_PORT)
      SESSIONS_DIR: /sessions    # 📨 TDLib userbot сессиялари (эски, tdlib профили — ҳозир ишлатилмайди)
      TGREADER_URL: http://tg-reader:8081   # 📨 Python (Telethon) хизмати — akkaunt ulash боshqaruvi
    # МУҲИМ: серверда ҳеч қандай порт ЧИҚАРИЛМАЙДИ — Caddy `app:8080` га ички тармоқ
    # орқали уланади. Шунинг учун сервердаги банд 8080 ҳеч нарсага халақит қилмайди.
    # Локал тест учун порт: docker-compose.dev.yml (HOST_PORT, BIND_ADDR).
    volumes:
      - applogs:/app/logs
      - tgsessions:/sessions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 📨 Telegram akkaunt(lar)iga (Telethon/MTProto) кириб, faqat TG_SOURCE_BOT xabarlarini o'qiydi va
  # HTTP orqali `app`ga uzatadi. mvn.mchv.eu tarmoq muammosidan mustaqil (PyPI orqali quriladi).
  tg-reader:
    build: ./tg-reader
    env_file: .env
    environment:
      TZ: Asia/Tashkent
      APP_URL: http://app:8080
      SESSIONS_DIR: /sessions
    volumes:
      - tgreadersessions:/sessions
    depends_on:
      - app
    restart: unless-stopped

  # ИШЛАБ ЧИҚАРИШ: домен + автомат HTTPS (Let's Encrypt). `./deploy.sh` шуни кўтаради.
  # Талаб: DOMAIN .env да, A-ёзуви шу серверга, 80/443 портлар очиқ.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    restart: unless-stopped

  # ТЕСТ: доменсиз вақтинчалик HTTPS (trycloudflare.com, ҳар ишга туширишда ЯНГИ манзил).
  # `./deploy.sh --tunnel` буни кўтаради ва WEBAPP_URL'ни ўзи ёзади.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["dev"]
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  applogs:
  caddydata:
  caddyconfig:
  tgsessions:
  tgreadersessions:
