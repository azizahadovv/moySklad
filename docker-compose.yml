services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kassa
      POSTGRES_USER: ${DB_USER:-data}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-data}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-data}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      TZ: Asia/Tashkent
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
