<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kassa Nazorati</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f4f5);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #18181b);
    --hint: var(--tg-theme-hint-color, #71717a);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --green: #16a34a; --red: #dc2626; --amber: #d97706;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 24px; }
  header { padding: 14px 16px 8px; }
  header h1 { font-size: 17px; }
  header .sub { color: var(--hint); font-size: 13px; }
  main { padding: 4px 12px 16px; }
  /* Bot reply-keyboard ko'rinishidagi menyu */
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .menu button, .mbtn {
    background: var(--card); color: var(--text); border: 0; border-radius: 10px;
    padding: 13px 8px; font-size: 14.5px; font-weight: 500; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .menu button:active { opacity: .65; }
  .menu .wide { grid-column: 1 / -1; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .muted { color: var(--hint); font-size: 13px; }
  .big { font-size: 17px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin-top: 6px; }
  .grid span:nth-child(even) { text-align: right; }
  .total { border-top: 1px dashed rgba(128,128,128,.35); margin-top: 8px; padding-top: 7px;
           display: flex; justify-content: space-between; font-weight: 700; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 10px; }
  .chip { border: 1px solid rgba(128,128,128,.35); background: var(--card); color: var(--text);
          border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters select, .filters input[type=date] {
    flex: 1; min-width: 130px; padding: 7px 9px; border-radius: 10px;
    border: 1px solid rgba(128,128,128,.35); background: var(--card); color: var(--text); font-size: 14px; }
  input.txt { width: 100%; padding: 11px; border-radius: 10px; font-size: 16px; margin: 8px 0;
    border: 1px solid rgba(128,128,128,.35); background: var(--card); color: var(--text); }
  .op { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px;
        border-bottom: 1px solid rgba(128,128,128,.15); }
  .op:last-child { border-bottom: 0; }
  .op .amt { font-weight: 700; white-space: nowrap; }
  .op .amt.in { color: var(--green); } .op .amt.out { color: var(--red); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
           background: rgba(128,128,128,.15); margin-right: 5px; }
  .warn { color: var(--amber); font-weight: 600; font-size: 13px; }
  .sumbar { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center;
            gap: 6px; margin-bottom: 8px; }
  .sumbar .s { background: var(--card); border-radius: 12px; padding: 8px 4px; }
  .sumbar .v { font-weight: 700; font-size: 14px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 90px; padding: 11px; border: 0; border-radius: 10px;
                 font-size: 14px; font-weight: 600; cursor: pointer; }
  .ok  { background: var(--green); color: #fff; }
  .no  { background: var(--red); color: #fff; }
  .mid { background: var(--amber); color: #fff; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .plain { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .empty { text-align: center; color: var(--hint); padding: 30px 0; }
  .err { background: #fee2e2; color: #991b1b; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .okmsg { background: #dcfce7; color: #166534; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .sect { font-size: 13px; font-weight: 700; color: var(--hint); text-transform: uppercase;
          letter-spacing: .4px; margin: 14px 2px 6px; }
  .step { color: var(--hint); font-size: 12px; margin-bottom: 4px; }
  dialog { border: 0; border-radius: 14px; padding: 16px; background: var(--card); color: var(--text);
           width: min(92vw, 340px); }
  dialog input, dialog textarea { width: 100%; margin: 6px 0; padding: 8px; border-radius: 8px;
           border: 1px solid rgba(128,128,128,.4); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1 id="title">💼 Kassa Nazorati</h1>
  <div class="sub" id="who">Yuklanmoqda…</div>
</header>
<main id="main"><div class="empty">⏳ Yuklanmoqda…</div></main>
<dialog id="dlg"></dialog>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const INIT = tg.initData;
const F = n => new Intl.NumberFormat('ru-RU').format(n);
let ME = null, KASSAS = [];
let stack = [];                 // sahifalar steki: {page, data}
let flow = {};                  // joriy wizard holati
let from = today(), to = today(), selKassa = 0, selType = '';
let pPeriod = {f: today(6), t: today()};
let rFrom = firstOfMonth(), rTo = today();

function today(d=0){ return new Date(Date.now()-d*864e5).toISOString().slice(0,10); }
function firstOfMonth(){ const d = new Date(); d.setDate(1); return d.toISOString().slice(0,10); }
function dd(s){ return s.split('-').reverse().join('.'); }
function esc(s){ return (''+(s??'')).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function M(mt){ return {NAQD:'💵 Naqd', KLIK:'📲 Click', TERMINAL:'💳 Terminal'}[mt]||mt; }
function T(t){ return {PRIXOD:'Kirim', VOZVRAT:'Vozvrat', RASXOD:'Rasxod', OTKAZMA:"O'tkazma",
  TOPSHIRIQ:'Hisobot', BOSHLANGICH:'Boshl. qoldiq', KORREKTIROVKA:'Korrektirovka'}[t]||t; }

async function api(path, opts={}) {
  const r = await fetch('/api'+path, {...opts, headers: {
    'X-Telegram-Init-Data': INIT, 'Content-Type': 'application/json', ...(opts.headers||{})}});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Xato: HTTP '+r.status));
  return j;
}
function alertTg(m){ tg.showAlert ? tg.showAlert(m) : alert(m); }

/* ---------- Navigatsiya (stek + BackButton) ---------- */
window.nav = (page, data={}) => { stack.push({page, data}); flow = {}; render(); };
function back(){ if (stack.length > 1){ stack.pop(); flow = {}; render(); } }
tg.BackButton.onClick(back);
window.home = () => { stack = [{page:'home', data:{}}]; flow = {}; render(); };

async function render(){
  const cur = stack[stack.length-1];
  tg.BackButton[stack.length > 1 ? 'show' : 'hide']();
  document.getElementById('title').textContent = '💼 Kassa Nazorati';
  const el = document.getElementById('main');
  try { await PAGES[cur.page](el, cur.data); }
  catch(e){ el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ================= 🏠 BOSH MENYU — bot klaviaturasi bilan bir xil ================= */
function menuBtn(label, page, data, wide){
  return `<button class="${wide?'wide':''}" onclick='nav("${page}", ${JSON.stringify(data||{})})'>${label}</button>`;
}
async function pageHome(el){
  let h = '<div class="menu">';
  if (ME.role === 'KASSIR'){
    h += menuBtn('📊 Bugungi holat', 'today')
       + menuBtn('💰 Balansim', 'mybalance')
       + menuBtn('💸 Rasxod', 'rasxod')
       + menuBtn("🔁 O'tkazma", 'transfer')
       + menuBtn('📤 Hisobot topshirish', 'submit')
       + menuBtn('🧾 Qarzlarim', 'debts')
       + menuBtn('📜 Tarix', 'tarix', {}, true);
  } else {
    h += menuBtn('🏪 Kassalar holati', 'kassalar')
       + menuBtn('📥 Kutilayotganlar', 'pending')
       + menuBtn("💸 Rasxod (o'zim)", 'rasxod')
       + menuBtn("🔁 O'tkazma", 'transfer')
       + menuBtn('🧾 Qarzlar registri', 'debts')
       + menuBtn('📜 Tarix', 'tarix')
       + menuBtn('📊 Excel hisobot', 'excel', {}, ME.role !== 'SUPERADMIN');
    if (ME.role === 'SUPERADMIN'){
      h += menuBtn("👥 Foydalanuvchi qo'shish", 'adduser')
         + menuBtn("🏪 Kassa qo'shish", 'addkassa')
         + menuBtn("💼 Boshlang'ich qoldiq", 'initbal')
         + menuBtn('👤 Foydalanuvchilar', 'users');
    }
  }
  h += '</div>';
  el.innerHTML = h;
}

/* ================= 🏪 KASSALAR HOLATI ================= */
async function pageKassalar(el){
  const bs = await api('/balances');
  const bux = bs.find(b=>b.id===0) || {naqd:0,klik:0,naqdBand:0,klikBand:0};
  let tot = {naqd:0, klik:0, terminal:0};
  for (const b of bs) if (b.id!==0){ tot.naqd+=b.naqd; tot.klik+=b.klik; tot.terminal+=b.terminal; }
  let h = `<div class="card" style="border:1px solid var(--accent)">
    <div class="big">💰 UMUMIY</div>
    <div class="grid">
      <span class="muted">💵 Naqd</span><span>${F(tot.naqd+bux.naqd)}</span>
      <span class="muted">📲 Click</span><span>${F(tot.klik+bux.klik)}</span>
      <span class="muted">💳 Terminal (bugun)</span><span>${F(tot.terminal)}</span>
    </div>
    <div class="total"><span>➕ Jami</span><span>${F(tot.naqd+bux.naqd+tot.klik+bux.klik+tot.terminal)} so'm</span></div>
  </div><div class="sect">🏪 Kassalar — profil uchun bosing</div>`;
  for (const b of bs){
    if (b.id === 0) continue;
    h += `<div class="card" style="cursor:pointer" onclick='nav("profil",{id:${b.id}})'>
      <div class="row"><span class="big">${esc(b.name)}</span><span class="big">${F(b.jami)}</span></div>
      <div class="muted">💵 ${F(b.naqd)} · 📲 ${F(b.klik)} · 💳 ${F(b.terminal)}
        ${b.naqdBand+b.klikBand>0?` · <span class="warn">band ${F(b.naqdBand+b.klikBand)}</span>`:''}</div>
    </div>`;
  }
  h += `<div class="sect">🏦 Buxgalteriya</div><div class="card"><div class="grid">
      <span class="muted">💵 Naqd</span><span>${F(bux.naqd)}${bux.naqdBand>0?` <small class="muted">(band ${F(bux.naqdBand)})</small>`:''}</span>
      <span class="muted">📲 Click</span><span>${F(bux.klik)}${bux.klikBand>0?` <small class="muted">(band ${F(bux.klikBand)})</small>`:''}</span>
    </div>
    <div class="total"><span>➕ Jami</span><span>${F(bux.naqd+bux.klik)} so'm</span></div></div>`;
  el.innerHTML = h;
}

/* ================= 👤 KASSA PROFILI ================= */
async function pageProfil(el, d){
  const p = await api(`/kassa/${d.id}/profile?from=${pPeriod.f}&to=${pPeriod.t}`);
  document.getElementById('title').textContent = `🏪 ${p.name}`;
  const td = p.today || {};
  const chip = (l,f,t)=>`<button class="chip ${pPeriod.f===f&&pPeriod.t===t?'on':''}"
      onclick='pPeriod={f:"${f}",t:"${t}"};render()'>${l}</button>`;
  let h = `<div class="card"><div class="grid">
      <span class="muted">💵 Naqd</span><span>${F(p.naqd)}${p.naqdBand>0?` <small class="muted">(band ${F(p.naqdBand)})</small>`:''}</span>
      <span class="muted">📲 Click</span><span>${F(p.klik)}${p.klikBand>0?` <small class="muted">(band ${F(p.klikBand)})</small>`:''}</span>
    </div>
    <div class="total"><span>➕ Jami balans</span><span>${F(p.jami)} so'm</span></div>
    ${p.openDays>0?`<div class="warn" style="margin-top:6px">⏳ Topshirilmagan kunlar: ${p.openDays}</div>`:''}
  </div>
  <div class="sect">📊 Bugun</div><div class="card"><div class="grid">
    <span class="muted">Kirim Naqd</span><span style="color:var(--green)">+${F(td.prixodNaqd||0)}</span>
    <span class="muted">Kirim Click</span><span style="color:var(--green)">+${F(td.prixodKlik||0)}</span>
    <span class="muted">Terminal</span><span>${F(td.prixodTerminal||0)}</span>
    <span class="muted">Rasxod Naqd</span><span style="color:var(--red)">−${F(td.rasxodNaqd||0)}</span>
    <span class="muted">Rasxod Click</span><span style="color:var(--red)">−${F(td.rasxodKlik||0)}</span>
  </div></div>`;
  if (p.kassirs.length)
    h += `<div class="sect">👤 Kassirlar</div><div class="card">`
      + p.kassirs.map(k=>`<div class="row"><span>${esc(k.name)}</span><span class="muted">${k.tgId}</span></div>`).join('')
      + `</div>`;
  h += `<div class="sect">📜 Tranzaksiyalar</div>
  <div class="chips">${chip('Bugun',today(),today())}${chip('7 kun',today(6),today())}${chip('30 kun',today(29),today())}</div>
  <div class="filters">
    <input type="date" value="${pPeriod.f}" onchange="pPeriod.f=this.value;render()">
    <input type="date" value="${pPeriod.t}" onchange="pPeriod.t=this.value;render()">
  </div>
  <div class="sumbar">
    <div class="s"><div class="muted">Kirim</div><div class="v" style="color:var(--green)">+${F(p.kirim)}</div></div>
    <div class="s"><div class="muted">Chiqim</div><div class="v" style="color:var(--red)">−${F(p.chiqim)}</div></div>
    <div class="s"><div class="muted">Farq</div><div class="v">${F(p.kirim-p.chiqim)}</div></div>
  </div>`;
  if (!p.ops.length) h += '<div class="empty">Bu davrda tranzaksiya yo\'q</div>';
  else {
    h += '<div class="card">'; let last='';
    for (const o of p.ops){
      if (o.date!==last){ last=o.date;
        h += `<div class="muted" style="margin:8px 0 2px;font-weight:600">📅 ${dd(o.date)}</div>`; }
      h += `<div class="op"><div><span class="badge">${T(o.type)}</span><span class="muted">${M(o.mt)}</span>
          ${o.comment?`<div class="muted" style="font-size:12px">${esc(o.comment)}</div>`:''}</div>
        <div class="amt ${o.in?'in':'out'}">${o.in?'+':'−'}${F(o.amount)}</div></div>`;
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

/* ================= 📊 BUGUNGI HOLAT / 💰 BALANSIM (kassir) ================= */
async function pageToday(el){
  if (!ME.kassaId){ el.innerHTML = '<div class="err">Sizga kassa biriktirilmagan</div>'; return; }
  await pageProfil(el, {id: ME.kassaId});
}
async function pageMyBalance(el){
  const bs = await api('/balances');
  let h = '';
  for (const b of bs)
    h += `<div class="card"><div class="big">${esc(b.name)}</div><div class="grid">
      <span class="muted">💵 Naqd</span><span>${F(b.naqd)}${b.naqdBand>0?` <small class="muted">(band ${F(b.naqdBand)})</small>`:''}</span>
      <span class="muted">📲 Click</span><span>${F(b.klik)}${b.klikBand>0?` <small class="muted">(band ${F(b.klikBand)})</small>`:''}</span>
      <span class="muted">💳 Terminal (bugun)</span><span>${F(b.terminal)}</span></div>
      <div class="total"><span>➕ Jami</span><span>${F(b.jami)} so'm</span></div></div>`;
  el.innerHTML = h || '<div class="empty">Balans yo\'q</div>';
}

/* ================= 💸 RASXOD (ketma-ket wizard) ================= */
async function pageRasxod(el){
  flow.step = flow.step || 1;
  const title = ME.role === 'KASSIR' ? '💸 Rasxod so\'rovi' : '💸 Buxgalteriya rasxodi';
  if (flow.step === 1){
    el.innerHTML = `<div class="card"><div class="step">1-qadam / 4</div><b>${title}</b>
      <div class="muted" style="margin:4px 0 8px">Pul turini tanlang:</div>
      <div class="btns">
        <button class="plain" onclick="flow.mt='NAQD';flow.step=2;render()">💵 Naqd</button>
        <button class="plain" onclick="flow.mt='KLIK';flow.step=2;render()">📲 Click</button>
      </div></div>`;
  } else if (flow.step === 2){
    el.innerHTML = `<div class="card"><div class="step">2-qadam / 4 · ${M(flow.mt)}</div>
      <b>Summani kiriting (so'm):</b>
      <input class="txt" id="amt" type="number" min="1" placeholder="Masalan: 500000" autofocus>
      <div class="btns"><button class="primary" onclick="
        const v=+document.getElementById('amt').value;
        if(!v||v<=0){alertTg('Musbat summa kiriting');return;}
        flow.amount=v;flow.step=3;render()">Davom etish ➡️</button></div></div>`;
  } else if (flow.step === 3){
    CATS = await api('/categories');
    el.innerHTML = `<div class="card"><div class="step">3-qadam / 4 · ${M(flow.mt)} · ${F(flow.amount)} so'm</div>
      <b>Kategoriyani tanlang:</b>
      <div class="menu" style="margin-top:8px">
        ${CATS.map((c,i)=>`<button onclick="pickCat(${i})">${esc(c.name)}</button>`).join('')}
        <button class="wide" onclick="pickCat(-1)">➖ Kategoriyasiz</button>
      </div></div>`;
  } else {
    el.innerHTML = `<div class="card"><div class="step">4-qadam / 4</div>
      <b>Izoh (shart emas):</b>
      <input class="txt" id="cmt" placeholder="Izoh yozish shart emas">
      <div class="card" style="background:var(--bg)">
        ${M(flow.mt)} · <b>${F(flow.amount)}</b> so'm${flow.catName?` · ${esc(flow.catName)}`:''}
        ${ME.role==='KASSIR'?"<div class='muted'>Buxgalter tasdiqlagach balansdan yechiladi</div>":''}
      </div>
      <div class="btns"><button class="ok" id="go" onclick="doRasxod()">✅ Yuborish</button></div>
      <div id="msg"></div></div>`;
  }
}
let CATS = [];
window.pickCat = i => {
  if (i < 0){ flow.catId = null; flow.catName = ''; }
  else { flow.catId = CATS[i].id; flow.catName = CATS[i].name; }
  flow.step = 4; render();
};
window.doRasxod = async ()=>{
  const b = document.getElementById('go'); b.disabled = true;
  try {
    const r = await api('/rasxod-create', {method:'POST', body: JSON.stringify({
      mt: flow.mt, amount: flow.amount, categoryId: flow.catId,
      comment: document.getElementById('cmt').value.trim()})});
    document.getElementById('msg').innerHTML =
      `<div class="okmsg">✅ ${r.pending ? 'So\'rov #'+r.id+' buxgalterga yuborildi — tasdiqni kuting'
                                        : 'Rasxod #'+r.id+' bajarildi'}</div>`;
    setTimeout(home, 1600);
  } catch(e){ b.disabled = false; document.getElementById('msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};

/* ================= 🔁 O'TKAZMA (ketma-ket wizard) ================= */
async function pageTransfer(el){
  flow.step = flow.step || 1;
  if (flow.step === 1){
    const targets = [];
    KASSAS.forEach((k,i)=>{
      if (!(ME.role==='KASSIR' && ME.kassaId===k.id))
        targets.push(`<button onclick="pickTarget(${i})">🏪 ${esc(k.name)}</button>`);
    });
    if (ME.role === 'KASSIR')
      targets.push(`<button class="wide" onclick="pickTarget(-1)">🏦 Buxgalteriya</button>`);
    el.innerHTML = `<div class="card"><div class="step">1-qadam / 5</div><b>🔁 O'tkazma</b>
      <div class="muted" style="margin:4px 0 8px">Kimga o'tkazasiz?</div>
      <div class="menu">${targets.join('')}</div></div>`;
  } else if (flow.step === 2){
    el.innerHTML = `<div class="card"><div class="step">2-qadam / 5 · ${esc(flow.toName)} ga</div>
      <b>Pul turini tanlang:</b>
      <div class="btns">
        <button class="plain" onclick="flow.mt='NAQD';flow.step=3;render()">💵 Naqd</button>
        <button class="plain" onclick="flow.mt='KLIK';flow.step=3;render()">📲 Click</button>
      </div></div>`;
  } else if (flow.step === 3){
    el.innerHTML = `<div class="card"><div class="step">3-qadam / 5 · ${esc(flow.toName)} · ${M(flow.mt)}</div>
      <b>Summani kiriting (so'm):</b>
      <input class="txt" id="amt" type="number" min="1" placeholder="Masalan: 1000000">
      <div class="btns"><button class="primary" onclick="
        const v=+document.getElementById('amt').value;
        if(!v||v<=0){alertTg('Musbat summa kiriting');return;}
        flow.amount=v;flow.step=4;render()">Davom etish ➡️</button></div></div>`;
  } else if (flow.step === 4){
    el.innerHTML = `<div class="card"><div class="step">4-qadam / 5</div>
      <b>O'tkazma turi:</b>
      <div class="menu" style="margin-top:8px">
        <button class="wide" onclick="flow.kind='ODDIY';flow.debtId=null;flow.step=5;render()">💠 Oddiy o'tkazma</button>
        <button onclick="flow.kind='QARZ_BERISH';flow.debtId=null;flow.step=5;render()">🤝 Qarz berish</button>
        <button onclick="pickDebt()">↩️ Qarz qaytarish</button>
      </div></div>`;
  } else {
    el.innerHTML = `<div class="card"><div class="step">5-qadam / 5</div>
      <b>Izoh (shart emas):</b>

/* ================= 📜 TARIX ================= */
async function pageTarix(el){
  const chip = (l,f,t)=>`<button class="chip ${from===f&&to===t?'on':''}" onclick='from="${f}";to="${t}";render()'>${l}</button>`;
  let kassaSel = '';
  if (ME.role !== 'KASSIR')
    kassaSel = `<select onchange="selKassa=+this.value;render()">
      <option value="0">Barcha kassalar</option>
      ${KASSAS.map(k=>`<option value="${k.id}" ${selKassa==k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select>`;
  el.innerHTML = `
    <div class="chips">${chip('Bugun',today(),today())}${chip('Kecha',today(1),today(1))}
      ${chip('7 kun',today(6),today())}${chip('30 kun',today(29),today())}${chip('Shu oy',firstOfMonth(),today())}</div>
    <div class="filters">
      <input type="date" value="${from}" onchange="from=this.value;render()">
      <input type="date" value="${to}" onchange="to=this.value;render()">
      ${kassaSel}
      <select onchange="selType=this.value;render()">
        <option value="">Barcha turlar</option>
        ${['PRIXOD','RASXOD','VOZVRAT','OTKAZMA','TOPSHIRIQ','BOSHLANGICH','KORREKTIROVKA']
          .map(t=>`<option value="${t}" ${selType===t?'selected':''}>${T(t)}</option>`).join('')}
      </select>
    </div><div id="opsBody"><div class="empty">⏳</div></div>`;
  const body = document.getElementById('opsBody');
  try {
    const ops = await api(`/operations?from=${from}&to=${to}&kassaId=${selKassa}&type=${selType}`);
    if (!ops.length){ body.innerHTML = '<div class="empty">Bu davrda tranzaksiya yo\'q</div>'; return; }
    let kirim=0, chiqim=0;
    for (const o of ops){
      if (['PRIXOD','BOSHLANGICH'].includes(o.type)) kirim += o.amount;
      if (['RASXOD','VOZVRAT','TOPSHIRIQ'].includes(o.type)) chiqim += o.amount;
    }
    let h = `<div class="sumbar">
      <div class="s"><div class="muted">Kirim</div><div class="v" style="color:var(--green)">+${F(kirim)}</div></div>
      <div class="s"><div class="muted">Chiqim</div><div class="v" style="color:var(--red)">−${F(chiqim)}</div></div>
      <div class="s"><div class="muted">Farq</div><div class="v">${F(kirim-chiqim)}</div></div>
    </div><div class="card">`;
    let last = '';
    for (const o of ops){
      if (o.date !== last){ last = o.date;
        h += `<div class="muted" style="margin:8px 0 2px;font-weight:600">📅 ${dd(o.date)}</div>`; }
      const out = ['RASXOD','VOZVRAT','TOPSHIRIQ'].includes(o.type);
      const dir = o.from && o.to ? `${esc(o.from)} → ${esc(o.to)}` : esc(o.from || o.to);
      h += `<div class="op"><div><span class="badge">${T(o.type)}</span><span class="muted">${M(o.mt)}</span>
          <div class="muted" style="font-size:12px">${dir}${o.category?` · ${esc(o.category)}`:''}${o.comment?`<br>${esc(o.comment)}`:''}</div></div>
        <div class="amt ${out?'out':'in'}">${out?'−':'+'}${F(o.amount)}</div></div>`;
    }
    body.innerHTML = h + '</div>';
  } catch(e){ body.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function pagePending(el){
  const p = await api('/pending');
  let h = '';
  if (p.rasxod.length) h += `<div class="sect">💸 Rasxod so'rovlari</div>`;
  for (const r of p.rasxod)
    h += `<div class="card"><div class="row"><b>#${r.id} · ${esc(r.from)}</b><span class="big">${F(r.amount)}</span></div>
      <div class="muted">${M(r.mt)} · ${dd(r.date)}${r.kassir?` · ${esc(r.kassir)}`:''}</div>
      ${r.comment?`<div class="muted">${esc(r.comment)}</div>`:''}
      <div class="btns"><button class="ok" onclick="decide('rasxod',${r.id},'approve')">✅ Tasdiqlash</button>
        <button class="no" onclick="askReason('rasxod',${r.id})">❌ Rad</button></div></div>`;
  if (p.transfer.length) h += `<div class="sect">🔁 O'tkazmalar</div>`;
  for (const t of p.transfer)
    h += `<div class="card"><div class="row"><b>#${t.id} · ${esc(t.from)} dan</b><span class="big">${F(t.amount)}</span></div>
      <div class="muted">${M(t.mt)} · ${dd(t.date)}</div>
      ${t.comment?`<div class="muted">${esc(t.comment)}</div>`:''}
      <div class="btns"><button class="ok" onclick="decide('transfer',${t.id},'approve')">✅ Oldim</button>
        <button class="no" onclick="decide('transfer',${t.id},'reject')">❌ Olmadim</button></div></div>`;
  if (p.submission.length) h += `<div class="sect">📤 Hisobotlar</div>`;
  for (const s of p.submission)
    h += `<div class="card"><div class="row"><b>#${s.id} · ${esc(s.kassa)}</b><span class="big">${F(s.naqd+s.klik)}</span></div>
      <div class="muted">Naqd ${F(s.naqd)} · Click ${F(s.klik)}</div>
      <div class="btns"><button class="ok" onclick="decide('submission',${s.id},'approve')">✅ To'liq</button>
        <button class="mid" onclick="askPartial(${s.id},${s.naqd},${s.klik})">🟡 Qisman</button>
        <button class="no" onclick="askReason('submission',${s.id})">❌ Rad</button></div></div>`;
  el.innerHTML = h || '<div class="empty">🎉 Kutilayotgan qarorlar yo\'q</div>';
}
