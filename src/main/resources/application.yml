server:
  port: ${WEBAPP_PORT:8080}

spring:
  task:
    scheduling:
      # Rejali ishlar (MoySklad sinxron, reconcile, Sheets, eslatmalar) parallel —
      # standart bitta oqimda biri ikkinchisini kutib qolardi
      pool-size: 4
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kassa}
    username: ${DB_USER:data}
    password: ${DB_PASSWORD:data}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  zone: Asia/Tashkent
  bot:
    token: ${BOT_TOKEN:}
    username: ${BOT_USERNAME:kassa_bot}
  superadmin:
    telegram-id: ${SUPERADMIN_TELEGRAM_ID:0}
    name: ${SUPERADMIN_NAME:SuperAdmin}
  moysklad:
    token: ${MOYSKLAD_TOKEN:}
    base-url: https://api.moysklad.ru/api/remap/1.2
    # MoySklad 'updated' filtri akkount timezone'ida o'qiladi — Toshkent bilan
    # farqni (±3 soat) va vaqtinchalik xatolarni qoplash uchun katta overlap.
    # Idempotent (moysklad_id UNIQUE) — qayta o'qish dublikat yaratmaydi.
    sync-overlap-minutes: ${MOYSKLAD_OVERLAP_MIN:240}
    # Chuqur solishtiruv (reconcile) oynasi: oxirgi N kun hujjatlari API bilan
    # to'liq solishtiriladi — o'chirilgan/o'zgargan hujjatlar avtomatik tuzatiladi.
    reconcile-days: ${MOYSKLAD_RECONCILE_DAYS:7}
    # Ledger boshlanish sanasi: boshlang'ich qoldiqlar (BOSHLANGICH) 17-18.08.2026 da
    # kiritilgan — bundan eski hujjatlar sinxron/reconcile'ga olinmaydi, bazadagi
    # eski yozuvlarga tegilmaydi (ikki marta hisoblanishdan himoya).
    ledger-start-date: ${MOYSKLAD_LEDGER_START:2026-08-18}
  reminder-hour: 21
  webapp-url: ${WEBAPP_URL:}
  gsheet:
    id: ${GSHEET_ID:}
    credentials: ${GOOGLE_SA_JSON:}
    script-url: ${GSHEET_SCRIPT_URL:}
    # G3: ochiq default OLIB TASHLANDI — sekret faqat .env dan keladi; bo'sh bo'lsa
    # Sheets sinxroni ishlamaydi (configured() false) va sekret tarqalmaydi.
    secret: ${GSHEET_SECRET:}

logging:
  level:
    uz.kassa: INFO
  # Loglar FAYLGA ham yoziladi (docker konteyner qayta yaratilganda stdout logi
  # yo'qoladi — hodisa tahlili uchun 14 kunlik arxiv saqlanadi)
  file:
    name: ${LOG_FILE:logs/kassa.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
